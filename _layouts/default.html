<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<header class="masthead">
  <a class="wordmark" href="{{ '/' | relative_url }}">Opus</a>
  <p class="tagline">{{ site.description }}</p>
</header>
<main class="page">
{{ content }}
</main>
<footer class="colophon">
  <p>{{ site.title }}</p>
</footer>
<script>
/* 月齢から月相を描く。data-moon-age を持つ .moon 要素すべてに対して。 */
document.querySelectorAll('.moon[data-moon-age]').forEach(function(el){
  var age = parseFloat(el.dataset.moonAge), P = 29.530588853;
  var phase = (age % P) / P;               // 0=新月 0.5=満月
  var k = Math.cos(2*Math.PI*phase);       // 1=新月 -1=満月
  var r = 18, cx = 20, cy = 20;
  var rightLit = phase < 0.5;              // 満ちる月は右が明るい（北半球）
  var gibbous  = k < 0;
  var rx = Math.max(Math.abs(k) * r, 0.01);
  var outer = rightLit ? 1 : 0;
  var inner = gibbous ? outer : 1 - outer;
  var d = 'M'+cx+','+(cy-r)+' A'+r+','+r+' 0 0 '+outer+' '+cx+','+(cy+r)
        + ' A'+rx+','+r+' 0 0 '+inner+' '+cx+','+(cy-r)+' Z';
  el.innerHTML = '<svg viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="月齢'+age+'">'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" class="moon-dark"/>'
    + (phase > 0.02 && phase < 0.98 ? '<path d="'+d+'" class="moon-lit"/>' : '')
    + '</svg>';
});
</script>
</body>
</html>
